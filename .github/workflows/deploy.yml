name: Laravel CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring,bcmath,intl,pdo_pgsql,zip
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  build:
    name: Build Docker Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build App Image
        run: |
          docker build \
            --tag ghcr.io/sayedtaqi313/laravel_aws-app:latest \
            .

      - name: Build Nginx Image
        run: |
          docker build \
            --tag ghcr.io/sayedtaqi313/laravel_aws-nginx:latest \
            ./docker/nginx

      - name: Push App Image
        run: |
          docker push ghcr.io/sayedtaqi313/laravel_aws-app:latest

      - name: Push Nginx Image
        run: |
          docker push ghcr.io/sayedtaqi313/laravel_aws-nginx:latest
